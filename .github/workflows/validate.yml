name: Validate HR analytics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild data and check regression tests
        run: |
          python scripts/pipeline.py
          python scripts/build_powerbi.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- data/processed
      - name: Reconcile against an isolated MySQL service
        run: |
          mysql --no-defaults --host=127.0.0.1 --user=root --execute="SET GLOBAL local_infile=1;"
          python scripts/run_mysql.py --no-password
